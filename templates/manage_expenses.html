<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Add Expenses - {{ trip.name }}</title>

    <link rel="stylesheet" href="/static/css/style.css">
    <script src="/static/js/script.js" defer></script>

</head>

<body>

    <header>

        <h1>Add Expense</h1>

        <p>{{ trip.name }}</p>

        <div class="expense-trip-selector">

    <span>
        Trip: <strong>{{ trip.name }}</strong>
    </span>

            <select id="change-trip">

                {% for available_trip in trips %}

                    <option
                        value="{{ available_trip.id }}"
                        {% if available_trip.id == trip.id %}selected{% endif %}
                    >
                        {{ available_trip.name }}
                    </option>

                {% endfor %}

            </select>

        </div>

    </header>


    <main>


        <!-- Add Expense -->

        <section>

            <h2>Add Expense</h2>

            <form method="POST">

                <label for="expense-title">
                    Expense Title
                </label>

                <input
                    type="text"
                    id="expense-title"
                    name="expense_title"
                    placeholder="e.g. Hotel"
                    required
                >


                <label for="expense-amount">
                    Amount
                </label>

                <input
                    type="number"
                    id="expense-amount"
                    name="expense_amount"
                    placeholder="Enter amount"
                    step="0.01"
                    min="0"
                    required
                >


                <label for="expense-paid-by">
                    Paid By
                </label>

                <select
                    id="expense-paid-by"
                    name="expense_paid_by"
                    required
                >

                    {% for member in members %}

                        <option value="{{ member.id }}">
                            {{ member.name }}
                        </option>

                    {% endfor %}

                </select>
                

                <label>
                    Split Between
                </label>

                <div class="split-options">

                    <label>
                        <input
                            type="radio"
                            name="split_type"
                            value="all"
                            checked
                        >
                        All Members
                    </label>

                    <label>
                        <input
                            type="radio"
                            name="split_type"
                            value="except"
                        >
                        Except
                    </label>

                </div>

                <div id="except-members" style="display: none;">

                    <p>Select members to exclude:</p>

                    {% for member in members %}

                        <label>
                            <input
                                type="checkbox"
                                name="excluded_members"
                                value="{{ member.id }}"
                            >
                            {{ member.name }}
                        </label>

                    {% endfor %}

                </div>

                <label for="expense-date">
                    Expense Date
                </label>

                <input
                    type="date"
                    id="expense-date"
                    name="expense_date"
                    required
                >


                

                <button type="submit">
                    Split & Save Expense
                </button>

            </form>

        </section>


        


        <!-- Back -->

        <section class="expense-navigation">


            <a href="/trip/{{ trip.id }}">
                <button type="button">Back to Trip</button>
            </a>

        </section>


    </main>
    

</body>

</html>
